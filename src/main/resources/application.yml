server:
  port: ${PORT:8082}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://andesstay-db.cmzs4nqytikw.us-east-1.rds.amazonaws.com:5432/andesstay}
    username: ${CATALOG_DB_USER:postgres}
    password: ${CATALOG_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Flyway: migraciones versionadas en src/main/resources/db/migration.
  # table: historial propio de catalog, porque reservations comparte la base y tiene el suyo.
  # baseline-version 0: en una base que ya tiene tablas, Flyway parte desde 0 y aplica V1 y V2.
  flyway:
    enabled: true
    table: flyway_schema_history_catalog
    baseline-on-migrate: true
    baseline-version: "0"
internal:
  token: ${INTERNAL_TOKEN:}
